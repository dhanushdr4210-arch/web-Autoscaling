apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: startscale-cpu-pressure-10
spec:
  selector:
    matchLabels:
      app: startscale-cpu-pressure-10
  template:
    metadata:
      labels:
        app: startscale-cpu-pressure-10
    spec:
      containers:
        - name: cpu-burn
          image: localhost:5000/startscale-target:v1
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import multiprocessing

              def burn():
                  x = 0
                  while True:
                      x = (x + 1) % 1000000

              workers = []

              for _ in range(4):
                  p = multiprocessing.Process(target=burn)
                  p.start()
                  workers.append(p)

              for p in workers:
                  p.join()

          resources:
            requests:
              cpu: "4000m"
              memory: "32Mi"
            limits:
              cpu: "4000m"
              memory: "64Mi"