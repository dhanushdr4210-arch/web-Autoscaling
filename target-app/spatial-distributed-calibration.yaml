apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spatial-distributed-calibration
spec:
  selector:
    matchLabels:
      app: spatial-distributed-calibration
  template:
    metadata:
      labels:
        app: spatial-distributed-calibration
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations: []
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist

      containers:
      - name: load
        image: python:3.12-slim
        command:
        - python
        - -c
        - |
          import multiprocessing
          import time

          def burn():
              x = 0
              while True:
                  x = (x + 1) % 1000000

          workers = []

          for _ in range(1):
              p = multiprocessing.Process(target=burn)
              p.start()
              workers.append(p)

          while True:
              time.sleep(60)

        resources:
          requests:
            cpu: "1000m"
            memory: "300Mi"
          limits:
            cpu: "1000m"
            memory: "300Mi"